<svg viewBox="0 0 30 30" width="28" height="28" xmlns="http://www.w3.org/2000/svg" fill="none" stroke="#e8cf8f" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
  <!-- 仗剑独行：一名独行者，长剑斜挎于背，迈步独行于天下 -->
  <!-- 脚下投影 -->
  <ellipse cx="9.8" cy="25.4" rx="5" ry="1" fill="#e8cf8f" fill-opacity=".16" stroke="none"/>
  <!-- 衣袍体块：上窄下阔，下摆外张 -->
  <path d="M7.6 10.4 L10.9 10.4 L12.1 18.2 Q9.6 19 7.1 18.2 Z" fill="#e8cf8f" fill-opacity=".13"/>
  <!-- 衣袍釉光：左襟一道受光弧 -->
  <path d="M8.3 12 Q8.9 14.4 8.6 16.6" stroke-width="1" stroke-opacity=".4"/>
  <!-- 迈开的双腿 -->
  <path d="M9 18.6 L6.6 24.4 M10.3 18.6 L13 24.4" stroke-width="2"/>
  <!-- 头 -->
  <circle cx="9.2" cy="8" r="2.15" fill="#e8cf8f" fill-opacity=".16" stroke-width="1.6"/>
  <!-- 斜挎长剑 · 剑身（自右肩过背，剑尖出左腿外侧） -->
  <path d="M17.5 4.6 L6 19" stroke-width="2.2"/>
  <!-- 剑身亮边：一侧釉光，出厚度 -->
  <path d="M18.2 5.2 L6.7 19.8" stroke-width=".9" stroke-opacity=".38"/>
  <!-- 剑格：横档点明这是剑 -->
  <path d="M16.8 8.7 L13.6 6.2" stroke-width="2"/>
  <!-- 剑首 -->
  <circle cx="18" cy="4.1" r=".9" fill="#e8cf8f" fill-opacity=".35" stroke-width="1.2"/>
</svg>
