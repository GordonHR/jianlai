<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>境界图标 · 柔和预览</title>
<style>
  body{margin:0;background:#15110e;color:#ddd2ba;font-family:"Noto Serif SC",serif;padding:30px 26px 60px;}
  h1{color:#e8c66a;letter-spacing:8px;font-weight:500;font-size:24px;margin:0 0 4px;}
  .sub{color:#8b8371;font-size:12px;letter-spacing:3px;margin:0 0 26px;}
  .grp-t{color:#b8893b;font-size:13px;letter-spacing:5px;margin:26px 0 12px;border-bottom:1px solid rgba(232,198,106,.16);padding-bottom:8px;}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px;}
  .cell{border:1px solid rgba(232,198,106,.18);background:rgba(20,17,15,.7);border-radius:8px;padding:16px;display:flex;gap:14px;align-items:flex-start;}
  .ic{flex:0 0 auto;}
  .ic svg{width:56px;height:56px;display:block;filter:drop-shadow(0 0 6px rgba(232,198,106,.22));}
  .nm{font-size:18px;letter-spacing:3px;color:#ece6d8;}
  .grp{font-size:11px;letter-spacing:2px;color:#9c9382;margin:3px 0 7px;}
  .d{font-size:12px;line-height:1.8;color:#a89f8c;letter-spacing:.5px;}
  .lost .nm{color:#7d7666;}
  .lost{border-style:dashed;}
  .alias{margin-top:30px;}
  .alias .cell .nm{font-size:15px;color:#e8c66a;}
  .note{margin-top:26px;font-size:11.5px;line-height:1.9;color:#7d7666;letter-spacing:1px;max-width:760px;}
</style>
</head>
<body>
  <h1>境 界 图 标</h1>
  <p class="sub">柔和金色线描 · 全曲线无尖角 · 复刻《剑来》原著境界体系</p>
  <div id="app"></div>
  <div class="note" id="note"></div>

  <script src="assets/realm/realm-icons.js?v=20260909a"></script>
  <script src="profile.js?v=20260909a"></script>
  <script>
    var app = document.getElementById('app');
    function cell(r){
      var key = r.n.replace(/\s/g,'');
      var svg = (typeof realmIconSVG==='function') ? realmIconSVG(r.n) : '';
      return '<div class="cell'+(r.lost?' lost':'')+'">'
        + '<div class="ic">'+svg+'</div>'
        + '<div><div class="nm">'+key+'</div>'
        + '<div class="grp">'+(r.grp||'')+'</div>'
        + '<div class="d">'+ (r.d||'') +'</div></div></div>';
    }
    function section(title, arr){
      var h = '<div class="grp-t">'+title+'</div><div class="grid">';
      h += arr.map(cell).join('');
      h += '</div>';
      return h;
    }
    var html = '';
    html += section('练气士 · 十五境', REALMS_LQ);
    html += section('武道 · 十三境', REALMS_WU);
    app.innerHTML = html;

    /* 角色角标别名（game.js 用到） */
    var aliases = ['练气','止境','飞升境','玉璞境','山巅境','武神境','止境·神到','十四境·合道','止境武夫','十五境'];
    var ah = '<div class="grp-t alias">角色角标 → 图标（粗粒度名映射）</div><div class="grid">';
    ah += aliases.map(function(a){
      var svg = (typeof realmIconForChar==='function') ? realmIconForChar(a) : '';
      return '<div class="cell"><div class="ic">'+svg+'</div><div><div class="nm">'+a+'</div>'
           + '<div class="grp">realmIconForChar</div></div></div>';
    }).join('');
    ah += '</div>';
    app.innerHTML += ah;

    document.getElementById('note').innerHTML =
      '说明：图标统一圆形章 + 贝塞尔曲线母题，stroke-linejoin:round，无任何 polygon / 直角。'
      + '境界说明（d）已按《剑来》原著核对（百度百科词条一致，无讹误）；合道、三教祖师、武神三处作了补充。';
  </script>
</body>
</html>
