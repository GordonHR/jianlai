<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>书简湖 · 底部入口预览</title>
<style>
* { box-sizing:border-box; margin:0; padding:0; }
body { background:#14110f; color:#e8e0d2; font-family:"PingFang SC","Microsoft YaHei",sans-serif; line-height:1.6; }
.lake { min-height:100vh; padding:28px 28px 120px; background:radial-gradient(circle at 50% 0%, #1d2a2a 0%, #14110f 70%); }
.lk-head { text-align:center; font-size:24px; font-weight:bold; color:#9ed4be; letter-spacing:8px; margin-bottom:14px; }
.lk-seen { text-align:center; font-size:13px; color:#8a7e6c; margin-bottom:24px; }
.lk-progress { text-align:center; font-size:12px; color:#8a7e6c; margin-bottom:18px; }
.lk-card { background:#1d1712; border:1px solid #3a2f23; border-radius:16px; padding:22px; margin-bottom:22px; }
.lk-ch { font-size:14px; color:#9ed4be; letter-spacing:3px; margin-bottom:12px; }
.lk-qt { font-size:20px; font-weight:bold; color:#c9a24b; margin-bottom:14px; }
.lk-qd { font-size:15px; color:#b8ac98; margin-bottom:16px; line-height:1.9; white-space:pre-wrap; }
.lk-line { font-size:13px; color:#8a7e6c; margin-bottom:6px; }
.lk-choice { background:#211b16; border:1px solid #3a2f23; border-radius:10px; padding:18px 20px; margin-bottom:14px; font-size:16px; color:#e8e0d2; }
/* 底部轻量工具栏 */
.lk-tools { position:fixed; left:0; right:0; bottom:0; z-index:90; display:flex; justify-content:center; gap:16px; padding:14px 28px 24px; background:rgba(20,17,15,.96); border-top:1px solid rgba(232,198,106,.12); }
.lk-tool { padding:10px 24px; border-radius:24px; font-size:15px; letter-spacing:2px; color:#c9a24b; background:rgba(29,23,18,.92); border:1px solid rgba(201,162,75,.45); cursor:pointer; }
.lk-tool.on { color:#14110f; background:rgba(158,212,190,.9); border-color:rgba(158,212,190,.9); }
/* 心境抽屉 */
.lk-sheet { position:fixed; left:0; right:0; top:0; bottom:0; z-index:100; pointer-events:none; }
.lk-sheet.show { pointer-events:auto; }
.lk-sheet-mask { position:absolute; inset:0; background:rgba(0,0,0,.55); opacity:0; transition:opacity .25s ease; }
.lk-sheet.show .lk-sheet-mask { opacity:1; }
.lk-sheet-body { position:absolute; left:0; right:0; bottom:0; height:80vh; max-height:760px; background:#181310; border-top:1px solid rgba(232,198,106,.22); border-radius:24px 24px 0 0; transform:translateY(100%); transition:transform .32s cubic-bezier(.25,.8,.25,1); }
.lk-sheet.show .lk-sheet-body { transform:translateY(0); }
.lk-sheet-handle { display:flex; justify-content:center; padding:18px 0 14px; cursor:pointer; }
.lk-sheet-bar { width:44px; height:4px; border-radius:2px; background:rgba(232,198,106,.35); }
.lk-sheet-scroll { height:calc(80vh - 38px); overflow-y:auto; padding:0 28px 36px; }
.lk-side-title { font-size:14px; color:#9ed4be; letter-spacing:2px; margin:8px 0 16px; border-left:4px solid #c9a24b; padding-left:12px; }
.lk-meter { display:flex; align-items:center; margin-bottom:14px; }
.lk-ml { width:88px; flex:none; font-size:13px; color:#b8ac98; }
.lk-mbar { flex:1; height:10px; background:#2a2018; border-radius:5px; overflow:hidden; }
.lk-mfill { height:100%; border-radius:5px; background:#9ed4be; width:60%; }
.lk-npc { display:flex; align-items:center; margin-bottom:14px; }
.lk-nl { width:88px; flex:none; font-size:13px; color:#b8ac98; }
.lk-nbar { position:relative; flex:1; height:10px; background:#2a2018; border-radius:5px; overflow:hidden; }
.lk-nfill { position:absolute; height:100%; border-radius:5px; background:#c9a24b; width:40%; }
.lk-flags { display:flex; flex-wrap:wrap; gap:8px; margin:10px 0 16px; }
.lk-flag { font-size:12px; color:#e8c66a; background:#241c10; border:1px solid #4a3a1d; border-radius:6px; padding:2px 10px; }
.lk-trail { display:flex; flex-direction:column; gap:10px; margin-top:8px; }
.lk-trail-item { font-size:13px; color:#b8ac98; }
.lk-trail-t { color:#8a7e6c; }
.lk-trail-n { color:#8a7e6c; }
</style>
</head>
<body>
<div class="lake">
  <div class="lk-head">书 简 湖 · 问 心 局</div>
  <div class="lk-seen">已见结局 1 / 19</div>
  <div class="lk-progress">第 1 章 · 进度 0%</div>
  <div class="lk-card">
    <div class="lk-ch">一 · 入湖</div>
    <div class="lk-qt">血，与笑</div>
    <div class="lk-qd">你收到顾璨的消息，连夜赶来。推开那扇门时，他正坐在血泊里擦剑，抬头看见你，咧嘴笑了：「哥，你来啦。」</div>
    <div class="lk-line">湖上：书简湖的水，从来都不太干净。</div>
    <div class="lk-line">心境：两个声音在心里吵架，谁也没赢。</div>
  </div>
  <div class="lk-choice">先听他说</div>
  <div class="lk-choice">先问：地上这些人，是谁</div>
  <div class="lk-choice">替他止血，余事再议</div>
</div>

<div class="lk-tools">
  <div class="lk-tool" id="btn-mood">心 境</div>
  <div class="lk-tool">结 局 图 鉴</div>
</div>

<div class="lk-sheet" id="sheet">
  <div class="lk-sheet-mask" id="mask"></div>
  <div class="lk-sheet-body">
    <div class="lk-sheet-handle" id="handle"><div class="lk-sheet-bar"></div></div>
    <div class="lk-sheet-scroll">
      <div class="lk-side-title">五维心境</div>
      <div class="lk-meter"><span class="lk-ml">情</span><div class="lk-mbar"><div class="lk-mfill" style="width:55%"></div></div></div>
      <div class="lk-meter"><span class="lk-ml">理</span><div class="lk-mbar"><div class="lk-mfill" style="width:48%"></div></div></div>
      <div class="lk-side-title">根本</div>
      <div class="lk-meter"><span class="lk-ml">文胆</span><div class="lk-mbar"><div class="lk-mfill" style="width:72%"></div></div></div>
      <div class="lk-side-title">六方态度</div>
      <div class="lk-npc"><span class="lk-nl">顾璨</span><div class="lk-nbar"><div class="lk-nfill" style="width:64%"></div></div></div>
      <div class="lk-side-title">卷宗</div>
      <div class="lk-trail">
        <div class="lk-trail-item"><span class="lk-trail-t">[入湖]</span> 你收到顾璨的消息 <span class="lk-trail-n">· 连夜赶来</span></div>
        <div class="lk-trail-item"><span class="lk-trail-t">[门]</span> 他坐在血泊里擦剑</div>
      </div>
    </div>
  </div>
</div>

<script>
const btn = document.getElementById('btn-mood');
const sheet = document.getElementById('sheet');
const mask = document.getElementById('mask');
const handle = document.getElementById('handle');
function toggle(){ sheet.classList.toggle('show'); btn.classList.toggle('on'); }
btn.addEventListener('click', toggle);
mask.addEventListener('click', toggle);
handle.addEventListener('click', toggle);
</script>
</body>
</html>
