  .char.justSel { animation:selLock .55s cubic-bezier(.2,.8,.3,1); }

  .char.spin { animation:cardSpin .55s ease-in-out; z-index:10; }

  /* 戏里戏外 · 故事详情 = 展开画卷：摊卷入�?+ 圆木画轴 + 随风晃动 + 光阴长河（与人物志详情同源） */
  /* 外层 .tale-sway �?grid 三列让左右画轴自动与画卷等高；只做居中容器，不晃�?*/
  .tale-sway { position:relative; max-width:816px; margin:6px auto 14px;
               display:grid; grid-template-columns:14px 1fr 14px; gap:0; align-items:stretch; }
  /* 内层 .tale-scroll 负责摊卷入场（居中展开，不做左右倾斜�?*/
  .tale-scroll { position:relative; max-width:760px; width:100%; margin:0 auto; padding:34px 52px 32px;
                 grid-column:2; justify-self:center;
                 transform-style:preserve-3d;
                 background:
                   radial-gradient(ellipse at 50% 0%, rgba(232,198,106,.07) 0%, transparent 55%),
                   radial-gradient(ellipse at 50% 100%, rgba(158,212,190,.04) 0%, transparent 50%),
                   repeating-linear-gradient(45deg, rgba(232,198,106,.016) 0 2px, transparent 2px 5px),
                   repeating-linear-gradient(135deg, rgba(0,0,0,.022) 0 1px, transparent 1px 4px);
                 border:1px solid rgba(232,198,106,.24); border-radius:4px;
                 box-shadow:0 16px 44px rgba(0,0,0,.55);
                 animation:taleUnroll .62s cubic-bezier(.2,.8,.3,1) both; }
  @keyframes taleUnroll {
    0%   { opacity:0; transform:scaleX(.06) scaleY(.92); filter:blur(5px); }
    60%  { opacity:1; transform:scaleX(1.022) scaleY(1.004); filter:blur(0); }
    100% { opacity:1; transform:scaleX(1) scaleY(1); filter:blur(0); } }
  /* 光阴长河 · 蒙版后的流动光影（与小程�?.cx-river 同源�?
     原实现是 SVG 线条水波平铺：波形在 tile 边界斜率不为 0、blur 超出 viewBox 被裁，接缝是硬折角�?
     改为整块柔光平铺——每块到 tile 边缘已衰减为全透明，接缝天然不可见；再叠一层反向慢�?+ 呼吸�?*/
  .tale-river { position:absolute; inset:0; z-index:1; pointer-events:none; overflow:hidden;
                mix-blend-mode:screen;
                -webkit-mask-image:radial-gradient(132% 78% at 50% 38%, #000 0%, rgba(0,0,0,.62) 52%, rgba(0,0,0,.18) 80%, transparent 100%);
                        mask-image:radial-gradient(132% 78% at 50% 38%, #000 0%, rgba(0,0,0,.62) 52%, rgba(0,0,0,.18) 80%, transparent 100%); }
  .tr-glow { position:absolute; inset:0;
    background-image:
      radial-gradient(closest-side, rgba(232,198,106,.30), rgba(232,198,106,.09) 48%, rgba(232,198,106,0) 80%),
      radial-gradient(closest-side, rgba(158,212,190,.17), rgba(158,212,190,0) 76%),
      radial-gradient(closest-side, rgba(255,240,205,.18), rgba(255,240,205,0) 76%);
    background-size:560px 420px, 420px 320px, 340px 300px;
    background-repeat:repeat;
    animation:trDriftA 34s linear infinite; }
  /* 第二层：超出边界外扩，做反向慢漂 + 呼吸，避免看出规律（父级 mask 会一并裁切） */
  .tr-glow.g2 { inset:-30%;
    background-image:
      radial-gradient(closest-side, rgba(232,198,106,.20), rgba(232,198,106,0) 78%),
      radial-gradient(closest-side, rgba(158,212,190,.13), rgba(158,212,190,0) 78%);
    background-size:640px 480px, 500px 380px;
    animation:trDriftB 46s ease-in-out infinite; }
  /* 位移量必须取各层 background-size 的整数倍，否则循环回跳会跳变（同样�?不连�?�?*/
  @keyframes trDriftA {
    from { background-position:0 0, 180px 120px, 120px 90px; }
    to   { background-position:560px 420px, -240px 440px, 460px 90px; } }
  @keyframes trDriftB {
    0%   { transform:translate3d(0,0,0) scale(1);      opacity:.5; }
    50%  { transform:translate3d(-5%,3%,0) scale(1.09); opacity:.92; }
    100% { transform:translate3d(0,0,0) scale(1);      opacity:.5; } }
  .tale-scroll .cx-tale-detail { position:relative; z-index:2; }
  /* 圆木画轴：grid item 高度自动与画卷等高；木纹 + �?底圆头端�?*/
  .tale-axis { position:relative; width:14px; pointer-events:none; z-index:3;
               border-radius:6px;
               background:linear-gradient(180deg, #3d2c1a 0%, #6a4a25 18%, #8a6433 50%, #6a4a25 82%, #3d2c1a 100%);
               box-shadow:0 0 8px rgba(232,198,106,.38), inset 0 0 4px rgba(0,0,0,.55);
               animation:axisUnroll .62s cubic-bezier(.2,.8,.3,1) both; }
  @keyframes axisUnroll {
    0%   { opacity:0; transform:scaleY(0); }
    55%  { opacity:1; transform:scaleY(1.04); }
    100% { opacity:1; transform:scaleY(1); } }
  /* 端钮：圆�?轴头"，金色光泽，挂在 .tale-sway 顶端/底端（grid item 内绝对定位） */
  .tale-axis::before, .tale-axis::after { content:''; position:absolute; left:50%;
    width:16px; height:16px; border-radius:50%; transform:translateX(-50%);
    background:radial-gradient(circle at 32% 32%, #f4dba6 0%, #c0955a 30%, #6a4a25 72%, #2a1d10 100%);
    box-shadow:0 0 6px rgba(232,198,106,.6), inset 0 0 2px rgba(0,0,0,.6); z-index:1; }
  .tale-axis::before { top:-7px; }      /* 顶端圆头 */
  .tale-axis::after  { bottom:-7px; }   /* 底端圆头 */
  /* 圆头溢出 .tale-axis 不影�?.tale-sway（grid item overflow visible 即可�?tale-sway 需保持 visible�?*/
  .tale-sway { overflow:visible; }
  .tale-axis.left  { grid-column:1; }
  .tale-axis.right { grid-column:3; }
  /* 朱印（角章，淡红不抢戏） */
  .tale-seal-tl, .tale-seal-br { position:absolute; z-index:4; pointer-events:none;
    width:32px; height:32px; border:1.5px solid rgba(180,60,40,.55); color:rgba(180,60,40,.65);

  .tale-seal-tl { top:13px; left:14px; }

  /* ================= 太平无事�?· 八十面箴言�?================= */
  /* 顶部不再渲染任何"�?�?�?�?标题（用�?2026-09-03 撤掉），改为仅按�?+ 右侧小计�?*/

  /* 操作条：返回 + 随机�?+ 右侧小计�?*/
  .wsp-bar { display:flex; align-items:center; justify-content:center; gap:12px;
             max-width:800px; margin:14px auto 14px; padding:0 6px; position:relative; }

  .wsp-bar .wsp-draw { background:rgba(232,198,106,.18); border:1px solid rgba(232,198,106,.55);

  .wsp-holder { max-width:800px; margin:0 auto; background:#1c1610;
                border:1px solid #3a2f23; border-radius:10px; padding:18px 18px 22px; }
  /* 木牌 2:3（与立绘同比例，竖版�?宽）；grid 5 列适应更长的牌�?*/
  .wsp-wall { display:grid; grid-template-columns:repeat(5,1fr); gap:14px 10px; }
  @media (max-width:740px){ .wsp-wall { grid-template-columns:repeat(4,1fr); } }
  @media (max-width:480px){ .wsp-wall { grid-template-columns:repeat(3,1fr); } }
  .wsp-card { position:relative; aspect-ratio:2/3; perspective:900px; cursor:pointer;
              animation:wspHang .5s ease-out both; }
  @keyframes wspHang { from { opacity:0; transform:translateY(-11px) rotate(-1.6deg); }
                       to   { opacity:1; transform:translateY(0) rotate(0deg); } }
  .wsp-inner { position:absolute; inset:0; transform-style:preserve-3d;
               transition:transform .52s cubic-bezier(.28,.8,.3,1); }
  .wsp-card.on .wsp-inner { transform:rotateY(180deg); }
  .wsp-face { position:absolute; inset:0; backface-visibility:hidden; border-radius:3px;
              border:1px solid #8a7455; }
  /* 牌背：素�?+ 悬绳 + 绳孔 + 蝇头小楷编号 */
  .wsp-wood { background:#c2ac86; overflow:hidden; }
  .wsp-wood::after { content:''; position:absolute; inset:0; pointer-events:none;
                     background:repeating-linear-gradient(96deg, rgba(90,66,38,.055) 0 3px, transparent 3px 9px); }
  .wsp-cord { position:absolute; top:0; left:50%; width:1px; height:13px; background:#7a6647; }
  .wsp-hole { position:absolute; top:15px; left:50%; margin-left:-3px; width:6px; height:6px;
              border-radius:50%; background:#1c1610; }
  .wsp-no { position:absolute; bottom:5px; right:7px; font-family:var(--kai); font-size:11px; color:#6f5c3e; }
  /* 牌面：竖版比例下整张牌做底（左右虚化让牌文透气），mask 上下都渐�?*/
  .wsp-words { background:#d9cbb0; transform:rotateY(180deg); transform-style:preserve-3d; overflow:hidden; }
  .wsp-art { position:absolute; left:0; right:0; bottom:0; width:100%; height:100%; object-fit:cover;
             object-position:50% 22%; filter:blur(6px) saturate(.5) brightness(.78); opacity:.36;
             -webkit-mask-image:linear-gradient(to bottom, rgba(0,0,0,0) 0%, rgba(0,0,0,.95) 28%, rgba(0,0,0,.95) 74%, rgba(0,0,0,0) 100%);
                     mask-image:linear-gradient(to bottom, rgba(0,0,0,0) 0%, rgba(0,0,0,.95) 28%, rgba(0,0,0,.95) 74%, rgba(0,0,0,0) 100%); }
  /* 无立绘时的底部纹路：浅墨卷草 + 右上角朱�?+ 左下暖光（双重径向让纹路不呆板） */
  .wsp-art.wsp-pattern { background:
              radial-gradient(circle at 84% 14%, rgba(180,69,60,.10) 0%, transparent 28%),
              radial-gradient(circle at 18% 86%, rgba(232,198,106,.10) 0%, transparent 30%),
              repeating-linear-gradient(125deg, rgba(90,66,38,.06) 0 1px, transparent 1px 7px),
              linear-gradient(170deg, #d9cbb0 0%, #c2ac86 100%); }
  .wsp-in2 { position:absolute; inset:0; transform-style:preserve-3d;
             transition:transform .5s cubic-bezier(.28,.8,.3,1); }
  .wsp-card.s2.on2 .wsp-in2 { transform:rotateX(180deg); }

  /* 多卡片页面不展示文字（用�?2026-09-03：只在弹框内展示），卡片仅留立绘+编号 */
  .wsp-seal { margin:22px auto 4px; text-align:center; opacity:0; transform:scale(.94);

  .wsp-seal.on { opacity:1; transform:scale(1); }
  .wsp-seal span { display:inline-block; border:2px solid rgba(180,69,60,.75); color:#c0604f;

  /* 放大详情层：2:3 竖版 + 翻转开�?+ 模糊立绘�?+ 四周金光 + 斜向光影 */
  #wsp-overlay { position:fixed; inset:0; z-index:60; display:flex; align-items:center; justify-content:center;

  /* 2:3（高>宽）；翻转开合（从左侧翻正，有过程） + inset 金边 */
  .wsp-dt-card { position:relative; width:min(64vw,400px); aspect-ratio:2/3; border-radius:9px; overflow:hidden;

  @keyframes wspFlip {
    from { opacity:0; transform:perspective(1400px) rotateY(-82deg) translateY(8px); }
    60%  { opacity:1; }
