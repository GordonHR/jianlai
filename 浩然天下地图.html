<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>浩然天下堪舆总图</title>
<style>
  :root{
    --paper:#e9dcbe; --ink:#2f2a20; --gold:#9a7b2e; --red:#9c3b2e; --side:#efe5cb;
    /* 默认画风：青绿山水（石绿陆地·石青山峰·青绿海水） */
    --land:#5a9b6e; --land-stroke:#2e5538; --sea:#bcd6d2;
    --ocean0:#dcebe7; --ocean1:#a9cbc6; --wave:#7fb0ad;
    --mtn-f:#356f8c; --mtn-s:#1d4560; --mtn-in:#16384e; --river:#5b86a8; --line:#5a6b52;
  }
  /* 水墨淡彩：宣纸留白·焦墨皴山·极淡青绿 */
  .mapstage[data-style="shuimo"]{
    --land:#e7e1d2; --land-stroke:#6b5f49; --sea:#e3e8e5;
    --ocean0:#eef2ef; --ocean1:#d3dbd7; --wave:#9fb2ad;
    --mtn-f:#5d594e; --mtn-s:#2e2a22; --mtn-in:#231f18; --river:#8fa6ac; --line:#6b5f49;
  }
  /* 金碧：泥金勾边·深石青海·富丽 */
  .mapstage[data-style="jinbi"]{
    --land:#4f9a6e; --land-stroke:#b5892f; --sea:#2f7d92;
    --ocean0:#3f93a8; --ocean1:#1c5263; --wave:#9fd4e0;
    --mtn-f:#2e6f96; --mtn-s:#b5892f; --mtn-in:#16384e; --river:#3f93b0; --line:#8a6a2e;
  }
  /* 浅绛山水：文人淡水彩·赭石山·花青轻罩·焦墨勾边 */
  .mapstage[data-style="qianjiang"]{
    --land:#e7dcc2; --land-stroke:#7a5a3a; --sea:#e6e3d8;
    --ocean0:#efeae0; --ocean1:#d8d1bf; --wave:#b9a07e;
    --mtn-f:#a9743f; --mtn-s:#6e3f1e; --mtn-in:#4a2a14; --river:#8a9ba0; --line:#7a5a3a;
  }
  /* 月夜图：靛蓝夜海·月白岛屿·朱砂最跳 */
  .mapstage[data-style="yeyue"]{
    --land:#cdd6e0; --land-stroke:#3a4a6a; --sea:#16243c;
    --ocean0:#24395c; --ocean1:#0d182c; --wave:#5a7aa8;
    --mtn-f:#3d5a82; --mtn-s:#1d2f4d; --mtn-in:#13203a; --river:#7e9ec4; --line:#3a4a6a;
  }
  /* 秋山：暖赭金林·枫朱秋意 */
  .mapstage[data-style="qiushan"]{
    --land:#9c8a4e; --land-stroke:#6e4a22; --sea:#cdbfa0;
    --ocean0:#d8cba8; --ocean1:#bba982; --wave:#b08a52;
    --mtn-f:#b5652e; --mtn-s:#7a3d18; --mtn-in:#54280f; --river:#8a9a8a; --line:#6e4a22;
  }
  /* 画风仅保留 6 套传统设色 + 写实绘卷底图 */
  /* 写实绘卷：底图为生成堪舆图，SVG 陆地轮廓隐去，保留交互点与路网 */
  .mapstage[data-style="huijuan"] .landfill{ fill:transparent !important; stroke:transparent !important; filter:none !important; }
  .mapstage[data-style="huijuan"] #mtn,
  .mapstage[data-style="huijuan"] #mtnS,
  .mapstage[data-style="huijuan"] .mtnG{ display:none !important; }
  .mapstage[data-style="huijuan"] #sea{ opacity:.15; }
  .mapstage[data-style="huijuan"] .cont-name{
    fill:#f3e8c8; stroke:#1a2430; stroke-width:3.5px; font-size:16px;
  }
  .mapstage[data-style="huijuan"] .pl{
    fill:#f0e6c4; stroke:#1a2430; stroke-width:3.2px;
  }
  .mapstage[data-style="huijuan"] .road{
    stroke:#e8c66a !important; opacity:.92;
  }
  .mapstage[data-style="huijuan"] .road:hover,
  .mapstage[data-style="huijuan"] .road.on{
    stroke:#ffb4a0 !important;
  }
  .painted-bg{ pointer-events:none; }
  /* 画风：把 SVG 元素绑定到 CSS 变量（随 data-style 实时切换） */
  #ocean stop:nth-child(1){stop-color:var(--ocean0)}
  #ocean stop:nth-child(2){stop-color:var(--ocean1)}
  #sea path{stroke:var(--wave)}
  #mtn>path:first-child{fill:var(--mtn-f);stroke:var(--mtn-s)}
  #mtn>path:last-child{stroke:var(--mtn-in);fill:none}
  #mtnS>path{fill:var(--mtn-f);stroke:var(--mtn-s)}
  .landfill{stroke:var(--land-stroke)}
  .stylebar{position:fixed;left:16px;bottom:16px;z-index:30;display:flex;align-items:center;gap:6px;
    background:rgba(239,229,203,.92);border:1px solid var(--line);border-radius:8px;padding:6px 8px}
  .stylebar .lbl{font-size:13px;color:#6b5f49;margin-right:2px}
  .stylebar select{font-family:inherit;font-size:13px;color:var(--ink);background:var(--side);
    border:1px solid var(--line);border-radius:6px;padding:5px 8px;cursor:pointer}
  .stylebar select:hover{background:#f3ecd6}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:#1c1812;font-family:"KaiTi","STKaiti","Songti SC","SimSun",serif;color:var(--ink)}
  .mapstage{position:fixed;inset:0;cursor:grab;background:#2a2419;overflow:hidden}
  .mapstage:active{cursor:grabbing}
  #map{width:100%;height:100%;display:block;touch-action:none}
  .zoom{position:fixed;right:16px;bottom:16px;display:flex;flex-direction:column;gap:6px;z-index:30}
  .zoom button{width:38px;height:38px;font-size:20px;line-height:1;border:1px solid var(--line);
    background:var(--side);color:var(--ink);border-radius:6px;cursor:pointer;font-family:inherit}
  .zoom button:hover{background:#f3ecd6}
  .zoom .pct{font-size:12px;text-align:center;color:#6b5f49;background:rgba(239,229,203,.85);border-radius:6px;padding:2px 0}
  .sidecol{position:fixed;top:0;right:0;height:100%;width:360px;max-width:90vw;background:var(--side);
    box-shadow:-6px 0 24px rgba(0,0,0,.35);transform:translateX(102%);transition:transform .28s ease;z-index:40;
    display:flex;flex-direction:column}
  @media (max-width:420px){
    .charrow{grid-template-columns:repeat(2,1fr)}
  }
  .sidecol.open{transform:translateX(0)}
  .sidecol .hd{padding:16px 16px 8px;border-bottom:2px solid var(--gold);position:relative}
  .sidecol .hd .tag{display:inline-block;font-size:12px;color:#fff;background:var(--gold);padding:1px 8px;border-radius:10px}
  .sidecol .hd h2{margin:8px 0 2px;font-size:21px}
  .sidecol .hd .sub{font-size:12px;color:#6b5f49}
  .sidecol .bd{padding:12px 16px 20px;overflow:auto;font-size:14px;line-height:1.7}
  .sidecol .bd p{margin:0 0 10px}
  .sidecol .src{margin-top:14px;font-size:12px;color:#8a785a;border-top:1px dashed var(--line);padding-top:10px}
  .sidecol .x{position:absolute;top:12px;right:12px;width:26px;height:26px;border:1px solid var(--line);
    background:#e3d6b4;color:var(--ink);border-radius:6px;cursor:pointer;font-size:15px;line-height:22px;text-align:center}
  .cont{cursor:pointer}
  .cont:hover .landfill{filter:brightness(1.07)}
  .cont-name{font-size:15px;fill:var(--ink);font-weight:bold;paint-order:stroke;stroke:#efe5cb;stroke-width:3px}
  .pl{font-size:19px;fill:var(--ink);font-weight:bold;paint-order:stroke;stroke:#efe5cb;stroke-width:3.4px}
  #lizhuBox{position:fixed;inset:0;background:#1c1812;z-index:50;display:none}
  #lizhuBox.open{display:block}
  #lizhuBox iframe{width:100%;height:100%;border:0}
  #lizhuBox .back{position:fixed;top:14px;left:14px;z-index:60;padding:8px 14px;border:1px solid var(--gold);
    background:var(--side);color:var(--ink);border-radius:8px;cursor:pointer;font-family:inherit;font-size:14px}
  .crumb{position:fixed;top:14px;left:14px;z-index:30;display:flex;gap:10px;align-items:center;
    font-size:14px;color:#e8dcc0; letter-spacing:1px}
  .crumb button{border:1px solid rgba(232,198,106,.45);background:rgba(20,17,15,.72);color:#e8c66a;
    border-radius:8px;padding:8px 14px;cursor:pointer;font-family:inherit;font-size:13px;letter-spacing:1px}
  .crumb button:hover{background:rgba(50,40,25,.85);border-color:#e8c66a}
  .crumb .here{font-family:var(--kai, "KaiTi","STKaiti",serif); font-size:18px; color:#f0e6c4;
    letter-spacing:3px; text-shadow:0 1px 6px rgba(0,0,0,.75)}
  .crumb .hint{font-size:12px; color:#a89b80; opacity:.85}
  /* 路网层 */
  .road{cursor:pointer; transition:stroke .15s, stroke-width .15s, opacity .15s}
  .road:hover, .road.on{stroke:#9c3b2e !important; stroke-width:4.2 !important; opacity:1 !important;
    filter:drop-shadow(0 0 4px rgba(156,59,46,.55))}
  .road-hit{stroke:transparent; stroke-width:14; fill:none; cursor:pointer}
  .road-lbl{font-size:11px; fill:#6b3a30; paint-order:stroke; stroke:#efe5cb; stroke-width:3px; pointer-events:none; opacity:.72}
  .road.on + .road-hit + .road-lbl, .road-lbl.show{opacity:1; fill:#9c3b2e}
  .layerbar{position:fixed;left:16px;bottom:56px;z-index:30;display:flex;gap:6px;flex-wrap:wrap;align-items:center;
    background:rgba(239,229,203,.92);border:1px solid var(--line);border-radius:8px;padding:6px 8px}
  .layerbar .lbl{font-size:13px;color:#6b5f49;margin-right:2px;align-self:center}
  .layerbar button{font-family:inherit;font-size:12px;color:var(--ink);background:var(--side);
    border:1px solid var(--line);border-radius:6px;padding:5px 10px;cursor:pointer}
  .layerbar button.on{background:#9c3b2e;color:#f5efe0;border-color:#7a2e24}
  .layerbar button:hover{background:#f3ecd6}
  .layerbar button.on:hover{background:#8a3428}
  .layerbar input[type=search]{font-family:inherit;font-size:12px;color:var(--ink);background:var(--side);
    border:1px solid var(--line);border-radius:6px;padding:5px 8px;width:120px;outline:none}
  .layerbar input[type=search]:focus{border-color:var(--gold)}
  .relrow{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 10px}
  .relrow button{font-family:inherit;font-size:12px;border:1px solid var(--line);background:#e3d6b4;
    color:var(--ink);border-radius:10px;padding:3px 10px;cursor:pointer}
  .relrow button:hover{background:#f3ecd6;border-color:var(--gold)}
  .hitlist{margin:0;padding:0;list-style:none;max-height:180px;overflow:auto}
  .hitlist li{padding:4px 2px;cursor:pointer;border-bottom:1px dashed rgba(90,107,82,.25)}
  .hitlist li:hover{background:#e3d6b4}
  .realm{cursor:pointer; transition:opacity .15s}
  .realm:hover{opacity:.28 !important}
  .realm-lbl{font-size:13px; font-weight:700; letter-spacing:2px; pointer-events:none;
    paint-order:stroke; stroke:#efe5cb; stroke-width:3px; opacity:.85}
  .charsec{margin:12px 0 4px;padding-top:10px;border-top:1px dashed var(--line)}
  .charsec h4{margin:0 0 8px;font-size:13px;color:#8a785a;font-weight:600;letter-spacing:1px}
  .charrow{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
  .charcard{box-sizing:border-box;background:#1d1712;border:1px solid #3a2f23;border-radius:8px;
    padding:6px;cursor:pointer;transition:background .15s,border-color .15s;min-width:0}
  .charcard:hover{background:#2a2118;border-color:#c9a24b}
  .charcard .port{position:relative;width:100%;aspect-ratio:2/3;border-radius:5px;overflow:hidden;
    background:#2a2118;display:flex;align-items:center;justify-content:center}
  .charcard .port img{width:100%;height:100%;object-fit:cover;display:block}
  .charcard .port .ph{font-size:28px;font-weight:700;opacity:.28;color:#c9a24b;line-height:1}
  .charcard .nm{margin-top:5px;text-align:center;font-size:12px;font-weight:700;color:#e8e0d2;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .charcard .sub{margin-top:1px;text-align:center;font-size:10px;color:#8a7e6c;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .chardetail .dport{display:flex;justify-content:center;margin:0 0 10px}
  .chardetail .dport img,.chardetail .dport .ph{width:120px;height:180px;border-radius:8px;
    border:2px solid #c9a24b;object-fit:cover;background:#2a2118}
  .chardetail .dport .ph{display:flex;align-items:center;justify-content:center;font-size:48px;
    font-weight:700;color:rgba(201,162,75,.35)}
  .chardetail .dname{text-align:center;font-size:18px;font-weight:700;color:#2f2a20;letter-spacing:2px}
  .chardetail .dpos{text-align:center;font-size:12px;color:#6b5f49;margin:4px 0 10px}
  .chardetail .dline{display:flex;flex-wrap:wrap;gap:6px 12px;justify-content:center;font-size:12px;margin-bottom:8px}
  .chardetail .dk{color:#8a785a;margin-right:2px}
</style>
</head>

<div class="mapstage">
  <svg id="map" viewBox="0 0 1600 1100" preserveAspectRatio="xMidYMid meet">
    <defs>
      <filter id="rough"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="1" seed="7" result="n"/>
        <feDisplacementMap in="SourceGraphic" in2="n" scale="2.4"/></filter>
      <pattern id="sea" width="46" height="24" patternUnits="userSpaceOnUse">
        <path d="M0,12 q11,-8 23,0 t23,0" fill="none" stroke="#7fb0ad" stroke-width="1" opacity="0.55"/>
      </pattern>
      <radialGradient id="ocean" cx="50%" cy="46%" r="70%">
        <stop offset="0%" stop-color="#dcebe7"/><stop offset="100%" stop-color="#a9cbc6"/>
      </radialGradient>
      <g id="mtn"><path d="M0,0 L9,-15 L16,-5 L25,-18 L34,0 Z" fill="#356f8c" stroke="#1d4560" stroke-width="1" stroke-linejoin="round"/>
        <path d="M6,-4 L13,-11 M17,-6 L24,-13" stroke="#16384e" stroke-width=".6" opacity=".5" fill="none"/></g>

      <g id="capital"><rect x="-9" y="-9" width="18" height="18" rx="2" fill="#b5892f" stroke="#5a3f12" stroke-width="1.4"/><rect x="-3" y="-3" width="6" height="6" fill="#f1e4c4"/></g>
      <g id="sect"><path d="M0,-13 L11,3 L-11,3 Z" fill="#8a6aa0" stroke="#4a2a5a" stroke-width="1.1"/><rect x="-3" y="3" width="6" height="9" fill="#6a4a7a"/></g>
      <!-- 中土神州：中央最大，海岸曲折，南侧附小岛链 -->
      <path id="land-zhongtu" d="M150,400 C176,342 214,300 286,282 C336,268 372,252 430,262 C470,272 486,248 524,240 C578,228 636,244 682,262 C746,282 812,292 872,320 C918,344 948,392 952,446 C956,498 924,548 872,578 C816,608 748,614 686,606 C640,600 604,616 556,618 C498,620 434,616 380,600 C316,580 258,544 214,494 C176,450 128,446 150,400 Z M404,646 C430,634 462,640 468,662 C474,684 444,700 420,690 C398,682 384,660 404,646 Z M506,668 C528,660 550,668 552,686 C554,704 528,714 510,704 C494,696 488,676 506,668 Z M604,650 C624,642 646,650 648,668 C650,686 626,696 608,686 C592,678 586,658 604,650 Z"/>
      <!-- 东宝瓶洲：瓶形，细颈广腹束底；东侧附二岛 -->

      <!-- 北俱芦洲：东北大块，北岸多峡湾，东北附屿 -->

      <!-- 皑皑洲：横长冰原，北侧浮冰 -->

      <!-- 流霞洲：西北，西南拖长尾，附屿 -->

      <!-- 金甲洲：正西大块，西北出岬，南岸缓 -->

      <!-- 扶摇洲：西南狭长倾斜，附屿 -->

      <!-- 桐叶洲：原著"状如桐叶"——宽大阔卵形，左（西）叶基宽圆、右（东）收成尖长叶尖，下带叶柄 -->
      <path id="land-tongye" d="M326,356 C424,324 540,322 616,350 C660,366 690,402 698,436 C690,468 660,492 606,492 C520,508 424,504 342,472 C314,464 302,442 304,416 C304,392 312,368 326,356 Z M308,408 C290,414 276,422 266,430 C274,438 288,440 308,436 Z"/>
      <!-- 南婆娑洲：正南大块，西侧岛链 -->
      <path id="land-posuo" d="M340,398 C360,368 396,354 434,354 C470,354 496,342 528,348 C570,354 606,376 622,406 C640,436 638,472 614,494 C586,516 550,522 514,520 C478,518 452,528 420,526 C384,524 348,508 328,478 C310,452 316,418 340,398 Z M262,410 C280,402 296,412 292,428 C288,444 266,448 256,434 C248,424 250,416 262,410 Z M206,440 C222,434 236,444 232,458 C228,472 208,476 200,464 C192,454 196,446 206,440 Z"/>
    </defs>

    <g id="ui-fixed">
      <g class="seal" transform="translate(1492,56)">
        <rect x="-26" y="-26" width="52" height="52" rx="4" fill="none" stroke="#9c3b2e" stroke-width="2.4"/>
        <text x="0" y="-4" text-anchor="middle" font-size="15" fill="#9c3b2e" font-weight="bold">剑来</text>
        <text x="0" y="16" text-anchor="middle" font-size="13" fill="#9c3b2e">舆地</text>
      </g>
      <g class="compass" transform="translate(1492,1010)">
        <circle r="30" fill="#efe5cb" stroke="#9a7b2e" stroke-width="1.6"/>
        <path d="M0,-26 L6,0 L0,26 L-6,0 Z" fill="#9c3b2e"/>
        <path d="M-26,0 L0,-6 L26,0 L0,6 Z" fill="#bcae86"/>
        <text x="0" y="-32" text-anchor="middle" font-size="12" fill="#2f2a20">北</text>
      </g>

pg"},"李槐":{"n":"李槐","r":"练气","p":"山崖书院 · 陈平安童年同窗","s":"","i":"骊珠洞天泥瓶巷的少年，与陈平安、李宝瓶、林守一同同走出小镇，赴山崖书院求学。性情跳脱，嘴快心热，是少年里最不懂修行却最重情的那一个。","img":"prototype/assets/portraits/李槐.jpg"},"林守一":{"n":"林守一","r":"止境","p":"中土文庙 · 陈平安童年同窗","s":"","i":"陈平安童年同窗，山崖书院同学。以一手算学起家，被视为少年一辈里最有望承继文庙道统的人，性子内秀沉稳。","img":"prototype/assets/portraits/林守一.jpg"},"杨老头":{"n":"杨老头","r":"飞升","p":"落魄山护道人 · 棋道高手","s":"","i":"落魄山暗中的护道人之一，与陈平安有半师之谊。棋子落处皆是布局，看似闲云野鹤，实则每一步都踩在棋眼上，是落魄山背后最稳的一双眼睛。","img":"prototype/assets/portraits/杨老头.jpg"},"魏檗":{"n":"魏檗","r":"止境","p":"落魄山山君","s":"","i":"落魄山山君之一，掌一方地形地势。能以山形压制来犯之敌，又每回合可自免一伤，是落魄山最稳的地利。","img":"prototype/assets/portraits/魏檗.jpg"},"裴钱":{"n":"裴钱","r":"练气","p":"陈平安大弟子 · 落魄山\"大徒弟\"","s":"","i":"陈平安收的第一个弟子，机灵泼辣、护短爱财，练就一身武艺，是落魄山最闹腾也最忠心的存在。一身江湖气，却把师父的话一句句记在心里。","img":"prototype/assets/portraits/裴钱.jpg"},"崔东山":{"n":"崔东山","r":"止境","p":"中土文庙 · 崔瀺少年分身","s":"","i":"崔瀺落入阴神转世后的少年分身，世人多以\"崔东山\"称之。看似跳脱不羁、嘴不饶人，实则算学惊人、护短至极，与陈平安亦师亦友，是落魄山上最不守规矩、也最护短的那个人。","img":"prototype/assets/portraits/崔东山.jpg"},"曹晴朗":{"n":"曹晴朗","r":"金丹境","p":"","s":"","i":"","img":"prototype/assets/portraits/曹晴朗.jpg"},"周米粒":{"n":"周米粒","r":"练气","p":"落魄山右护法 · 护山供奉 · 哑巴湖大水怪","s":"落魄山","i":"陈平安远游北俱芦洲途中，于哑巴湖旁「捡」到的一个大水怪。它总自称「米粒大」的大水怪，陈平安便给它取名周米粒。黑衣小童模样，真身是通体漆黑的十数丈怪鱼，龙门境。每日早起巡山一遍，爱吃棉布包里的瓜子，是落魄山上的小小耳报神，也是陈平安最宠的「小米粒」。它最大的心愿，是有人把它的故事写进书里。","img":"prototype/assets/portraits/周米粒.jpg"},"朱敛":{"n":"朱敛","r":"止境","p":"落魄山管家 · 武道高人","s":"","i":"落魄山管家，表面恭谨周到，实则是深不可测的武道宗师。初见陈平安便看穿其根骨，甘愿隐于山门做起洒扫待客的活计，是落魄山最稳的倚仗。","img":"prototype/assets/portraits/朱敛.jpg"},"姜尚真":{"n":"姜尚真","r":"止境","p":"落魄山首席供奉 · 副山主 · 玉圭宗宗主","s":"落魄山 · 玉圭宗","i":"桐叶洲玉圭宗宗主，化名周肥（春潮宫宫主），仙人境剑修。本命飞剑仅剩一片柳叶，却有「一片柳叶斩仙人」的杀力。与陈平安结识于藕花福地，本是某种意义上的对手，后了解陈平安身份，死皮赖脸蹭上落魄山首席供奉的名号，更一路从供奉做到副山主，是落魄山的天使投资人，把把高端局。蛮荒大战时，他一个仙人境从数名飞升境手","img":"prototype/assets/portraits/姜尚真.jpg"},"长命":{"n":"长命","r":"止境","p":"散修 · 丹药大修","s":"","i":"散修里的丹药大修，所炼灵丹可救伤续命，是落魄山最温厚的手。性子温厚，于同袍有难时总肯伸手。","img":"prototype/assets/portraits/长命.jpg"},"郭竹酒":{"n":"郭竹酒","r":"止境","p":"陈平安弟子 · 剑气长城郭稼之女 · 小名绿端","s":"落魄山","i":"剑气长城剑仙郭稼的独女，小名绿端，腰间悬一枚碧绿抄手砚。先天剑胚，手握两把本命飞剑，如今是金丹境剑修。在剑气长城便缠着陈平安要拜师，常与朋友去他和叠嶂开的酒铺捧场，还偷偷在平安无事牌上刻下「师父卖酒徒弟买酒，师徒之谊感人肺腑天长地久」。陈平安夜里收下这个性情跳脱的弟子，一则因郭家是当年唯一举家祭奠宁","img":"prototype/assets/portraits/郭竹酒.jpg"},"陈暖树":{"n":"陈暖树","r":"练气","p":"落魄山小管家 · 粉裙女童 · 陈如初","s":"落魄山","i":"本体是黄庭国芝兰府藏书楼里文运所化的一头火蟒，被崔东山收服后送与陈平安当书童。化为人形是粉雕玉琢的乖巧女童，龙门境。陈平安取名「暖树」，取自「暖律潜催，幽谷暄和，黄鹂翩翩，乍迁芳树」首尾各一字；她怕陈平安随意取名，抢先自号「陈如初」，得知深意后偷偷哭了好久。回落魄山后执掌全山房屋钥匙与账簿，把山上里","img":"prototype/assets/portraits/陈暖树.jpg"},"崔瀺":{"n":"崔瀺","r":"飞升","p":"大骊国师\"绣虎\"· 老秀才首徒 · 齐静春师兄","s":"","i":"老秀才门下大弟子，齐静春师兄。因道不同而渐行渐远；后入大骊为国师，自号\"绣虎\"，暗中为浩然天下布局一生。算计深远却不失护持之心，是陈平安成长路上绕不开的名字。于十四境合道宝瓶洲文脉（一洲文运），是文庙之外以一国一域证十四境的典型——先布局、后入道","img":"prototype/assets/portraits/崔瀺.jpg"},"caoci":{"n":"曹慈","r":"止境","p":"大骊武夫 · 武道天才 · 曹氏麒麟儿","s":"大骊","i":"大骊王朝曹氏的武道天才，与陈平安同辈争锋。曾三上落魄山与陈平安问拳，不为胜负，只为印证武道。拳意纯粹、重诺守心，是年轻一代武夫中走得最远的人之一。","img":"prototype/assets/portraits/caoci.jpg"},"搬山猿":{"n":"搬山猿","r":"止境","p":"正阳山供奉 · 搬山猿大妖","s":"","i":"正阳山供奉的搬山猿，力大无穷、性情暴烈。为夺刘羡阳家传剑经，他曾大闹骊珠洞天，与陈平安、刘羡阳结下死仇，是陈平安少年时代见识到的\"强者无情\"。","img":""},"魏晋":{"n":"魏晋","r":"止境","p":"剑气长城剑修 · 宁姚同代","s":"","i":"剑气长城剑修，与宁姚同代并肩的剑道良才，剑心相惜、协同御蛮，是长城年轻一代的中坚，性子儒雅沉静。","img":"prototype/assets/portraits/魏晋.jpg"},"石柔":{"n":"石柔","r":"练气","p":"骑龙巷压岁铺子代掌柜 · 落魄山门下","s":"落魄山 · 骑龙巷压岁铺子","i":"彩衣国胭脂郡出身的枯骨女鬼，作恶之时被陈平安收服，立下卖身契，自此效力落魄山。桐叶宗飞升境杜懋伏诛之后，崔东山施法，让她寄居那具仙人遗蜕：白日里以杜懋的男子面目行走人间，入夜才得恢复女子真身，一身彩衣、长裙大袖。如今替落魄山看管骑龙巷的压岁铺子，无需睡眠，把日子过得安稳而小心。","img":""},"刘灞桥":{"n":"刘灞桥","r":"止境","p":"散修 · 灞桥剑修","s":"","i":"散修里的灞桥剑修，出招繁密，回合内常常热闹非凡。性子直率出彩，是散修里最不缺存在感的那一位。","img":"prototype/assets/portraits/刘灞桥.jpg"},"至圣先师":{"n":"至圣先师","r":"飞升","p":"中土文庙至圣 · 儒教源头","s":"","i":"文庙儒教至圣先师，万世师表，立\"仁义礼智信\"之教，是读书人精神的最高象征，与道祖、佛祖并列为三教源头。","img":"prototype/assets/portraits/至圣先师.jpg"},"lisan":{"n":"礼圣","r":"飞升","p":"中土文庙礼圣 · 规矩化身","s":"中土文庙 · 礼圣","i":"文庙诸圣之一，主\"礼\"与\"规矩\"，以礼法约束天下秩序，性情清正古板却心怀天下，是文庙秩序最坚定的维护者。于十四境合道浩然天下礼序规矩（\"特殊\"一项，非天时/地利/人和），据传随时可上十五境，是三教祖师之下当前战力的天花板之一。","img":"prototype/assets/portraits/lisan.jpg"},"亚圣":{"n":"亚圣","r":"止境","p":"中土文庙亚圣 · 儒家道统之二","s":"","i":"文庙诸圣之一，地位仅次于至圣先师。他主\"性善\"与\"仁政\"，是儒家道统中承上启下的巨擘。与老秀才（即文圣）因学说分歧多有争执，却同样是读书人风骨的化身。于十四境合道中土神洲（地利），门下桃李满天下，是儒门半边天的柱石。","img":"prototype/assets/portraits/亚圣.jpg"},"老秀才":{"n":"老秀才","r":"飞升","p":"中土文庙至圣一脉 · 陈平安之师","s":"","i":"文庙第四圣，世称\"老秀才\"（即文圣），曾因弟子之争被逐出文庙，后收陈平安为关门弟子，传\"讲道理、守底线\"之道。性情诙谐坎坷，却是读书人风骨。门下首徒崔瀺、大徒齐静春皆为一时人杰。于十四境合道三洲之地——西南扶摇洲、正南婆娑洲、东南桐叶洲（据传本可走人和，未走）。","img":"prototype/assets/portraits/老秀才.jpg"},"baiye":{"n":"白也","r":"十四境·合道","p":"浩然天下诗剑第一人 · 人间最得意","s":"浩然天下 · 白玉京","i":"青衫仗剑、以诗入道的剑修，被誉为人间最得意。他不属剑气长城，却曾提剑登城，与长城剑仙并肩斩蛮。诗成处剑气纵横，是浩然天下风骨与杀力的象征。于十四境合道「心中诗篇」，诗不尽则灵气不竭、战力不休，扶摇洲一役独战七王座。","img":"prototype/assets/portraits/baiye.jpg"},"郑居中":{"n":"郑居中","r":"止境","p":"散修 · 居中策士","s":"","i":"散修里的居中策士，手牌多于常人，处事居中调度、不露破绽。是散修里难得的谋士型人物，沉稳有章法。于十四境走出一条从未有过的合道路数——「一人两十四」：一身可一分为二、道心如一、各自登顶，被称魔道第一人，战力对标余斗这一档。","img":"prototype/assets/portraits/郑居中.jpg"},"于玄":{"n":"于玄","r":"止境","p":"散修 · 循环老者","s":"","i":"散修老者，一生讲究循环之道，弃旧取新、生生不息。性子老辣不争，却活得长久通透，是散修里少有的\"活得明白\"之人。","img":"prototype/assets/portraits/于玄.jpg"},"火龙真人":{"n":"火龙真人","r":"止境","p":"散修 · 火德铸剑师","s":"","i":"散修里的火德修士，自带火龙剑胚，铸剑与斗法皆带火。于对抗蛮荒一脉时格外凌厉，是火道修行里的实力派。据传其十四境合道方式近似「火道」本身（火德一脉之极致），是散修里唯一以火入合道的特例。","img":"prototype/assets/portraits/火龙真人.jpg"},"liujinglong":{"n":"刘景龙","r":"飞升境","p":"","s":"","i":"","img":""},"贺小凉":{"n":"贺小凉","r":"止境","p":"散修 · 凉州女修","s":"","i":"凉州女修，性子果决如秋风。于判定之事常有主见，一旦落子便无可挽回，是散修里最冷静果敢的那一位。","img":"prototype/assets/portraits/贺小凉.jpg"},"纳兰烧苇":{"n":"纳兰烧苇","r":"止境","p":"蛮荒天下 · 火妖","s":"","i":"蛮荒火属大妖，剑气附带灼烧之焰。苇草易燃，她的怒火一旦点燃便难以熄灭，是蛮荒阵营里凌厉的火尖。","img":""},"xunyuan":{"n":"荀渊","r":"飞升境","p":"桐叶洲玉圭宗老宗主 · 飞升境大修士","s":"桐叶洲 · 玉圭宗","i":"桐叶洲玉圭宗老宗主，飞升境大修士。本命枪法「一尺枪」，常书「余家贫」三字自况；与姜尚真亦师亦友。蛮荒入侵桐叶洲时，玉圭宗撑起一洲门户，他于大战中陨落，是桐叶洲最沉的那座山。（原著人物）","img":""},"余斗":{"n":"余斗","r":"止境","p":"白玉京二掌教 · 道老二「真无敌」","s":"","i":"道祖\"一气化三清\"之分身，排行第二，号\"道老二\"，世称\"真无敌\"，执掌白玉京。青冥余氏传人，习斗转星移之术，与人交手时距离常被无形改写。行事大公无私，曾亲手斩杀两位大道同行的挚友——与陈平安在书简湖的选择互为对照（书简湖设局人是崔瀺，非他）。合道方式在各家百科中列\"未知\"，但借整座玉京山之力可临时爆","img":"prototype/assets/portraits/余斗.jpg"},"齐廷济":{"n":"齐廷济","r":"止境","p":"剑气长城齐家剑修","s":"","i":"齐氏剑修，与齐景龙并称\"齐家双璧\"。出剑讲究规矩与配合，是长城齐姓一脉的栋梁，后辈敬仰的前辈。","img":"prototype/assets/portraits/齐廷济.jpg"},"陆芝":{"n":"陆芝","r":"止境","p":"剑气长城女剑修","s":"","i":"长城女修，本命飞剑「抱朴」「北斗」，北斗主死。剑风清朗如玉芝，于同袍有难时常肯援手，是长城里被信任的搭档，剑心上干净通透。","img":"prototype/assets/portraits/陆芝.jpg"}};

  s+='<circle cx="44" cy="-8" r="13" fill="#9c3b2e" stroke="#5a2018" stroke-width="1.2" filter="url(#rough)"/>';

function fitLayer(detail){
  const d=detail||{};
  const xs=[], ys=[];
  (d.places||[]).forEach(p=>{
    xs.push(p.x, p.lx!=null?p.lx:p.x);
    ys.push(p.y, p.ly!=null?p.ly:p.y);
  });
  (d.realms||[]).forEach(r=>{
    if(r.lx!=null){ xs.push(r.lx); ys.push(r.ly); }
    if(r.d){
      const nums=r.d.match(/-?\d+(?:\.\d+)?/g)||[];
      for(let i=0;i<nums.length;i+=2){
        const x=parseFloat(nums[i]), y=parseFloat(nums[i+1]);
        if(isFinite(x)&&isFinite(y)){ xs.push(x); ys.push(y); }
      }
    }
  });
  (d.mtn||[]).forEach(m=>{ xs.push(m.x); ys.push(m.y); });
  (d.roads||[]).forEach(r=>{
    const path=(r&&typeof r==='object')?r.d:r;
    if(!path) return;
    const nums=path.match(/-?\d+(?:\.\d+)?/g)||[];
    for(let i=0;i<nums.length;i+=2){
      const x=parseFloat(nums[i]), y=parseFloat(nums[i+1]);
      if(isFinite(x)&&isFinite(y)){ xs.push(x); ys.push(y); }
    }
  });
  if(!xs.length) return {ox:220, oy:140, s:1.35};
  const minX=Math.min.apply(null,xs), maxX=Math.max.apply(null,xs);
  const minY=Math.min.apply(null,ys), maxY=Math.max.apply(null,ys);
  const bw=Math.max(60, maxX-minX), bh=Math.max(60, maxY-minY);
  const padX=200, padY=120;
  const availW=1600-padX*2, availH=1100-padY*2;
  const sc=Math.min(availW/bw, availH/bh, 2.4);
  return {
    ox: padX+(availW-bw*sc)/2 - minX*sc,
    oy: padY+(availH-bh*sc)/2 - minY*sc,
    s: sc
  };
}

function renderZhou(key){
  const z=ZHOU[key]; if(!z) return;
  const painted = (stageEl && stageEl.dataset.style === 'huijuan');
  const zhouImg = 'map-assets/zhou-'+key+'.png';
  const d=z.detail;
  let s='';
  s+='<rect x="0" y="0" width="1600" height="1100" fill="url(#ocean)"/>';
  if(painted){
    s+=`<image class="painted-bg" href="${zhouImg}" x="0" y="0" width="1600" height="1100" preserveAspectRatio="xMidYMid slice"/>`;
  }else{
    s+='<rect x="0" y="0" width="1600" height="1100" fill="url(#sea)"/>';
  }
  const fit=fitLayer(d);
  const gx=fit.ox, gy=fit.oy, gs=fit.s;
  s+=`<g transform="translate(${gx},${gy}) scale(${gs})">`;
  if(!painted){
    s+=`<use href="#land-${key}" class="landfill" fill="var(--land)" stroke="var(--land-stroke)" stroke-width="2.2" filter="url(#rough)"/>`;
    if(showRealms && d.realms){
      d.realms.forEach(r=>{
        s+=`<path class="realm" data-rkey="${r.key}" data-zhou="${key}" d="${r.d}" fill="${r.fill||'#b5892f'}" opacity="0.16" stroke="${r.fill||'#b5892f'}" stroke-width="1.2" stroke-dasharray="6 4"/>`;
        if(showNames && r.lx!=null){
          s+=`<text class="realm-lbl" x="${r.lx}" y="${r.ly}" text-anchor="middle" fill="${r.fill||'#6b5f49'}">${r.name}</text>`;
        }
      });
    }
    if(d.territory) s+=`<path d="${d.territory}" fill="#b5892f" opacity="0.16" stroke="#b5892f" stroke-width="1" stroke-dasharray="5 4"/>`;
    (d.rivers||[]).forEach(r=>{ s+=`<path d="${r.d}" fill="none" stroke="var(--river)" stroke-width="3" opacity=".7" filter="url(#rough)"/>`; });
    (d.mtn||[]).forEach(m=>{ s+=`<use href="#mtn" class="mtnG" transform="translate(${m.x},${m.y}) scale(${m.s})"/>`; });
  } else if(showRealms && d.realms){
    /* 绘卷底图下仍叠势力范围，保证信息完整 */
    d.realms.forEach(r=>{
      s+=`<path class="realm" data-rkey="${r.key}" data-zhou="${key}" d="${r.d}" fill="${r.fill||'#b5892f'}" opacity="0.22" stroke="${r.fill||'#b5892f'}" stroke-width="1.4" stroke-dasharray="6 4"/>`;
      if(showNames && r.lx!=null){
        s+=`<text class="realm-lbl" x="${r.lx}" y="${r.ly}" text-anchor="middle" fill="#f0e6c4" stroke="#1a2430" stroke-width="2.5">${r.name}</text>`;
      }
    });
  }
  if(showRoads){
    const rStroke = painted ? '#e8c66a' : '#caa86a';
    (d.roads||[]).forEach((r,i)=>{
      const isObj = r && typeof r === 'object';
      const path = isObj ? r.d : r;
      const name = isObj ? (r.name||'古道') : '洲内古道';
      const via = isObj && (r.from||r.to) ? `${r.from||'?'} ↔ ${r.to||'?'}` : '';
      const desc = isObj ? (r.desc||'') : '';
      s+=`<path class="road" data-name="${name}" data-via="${via}" data-desc="${desc}" data-i="${i}" d="${path}" fill="none" stroke="${rStroke}" stroke-width="${painted?2.4:3.4}" opacity=".88"/>`;
      s+=`<path class="road-hit" data-name="${name}" data-via="${via}" data-i="${i}" d="${path}" fill="none"/>`;
      if(showRoadLbl && name && name!=='古道'){
        const mm=path.match(/M\s*(-?[\d.]+)\s*,\s*(-?[\d.]+)/);
        if(mm){
          const rx=parseFloat(mm[1]), ry=parseFloat(mm[2]);
          s+=`<text class="road-lbl" data-i="${i}" x="${rx+8}" y="${ry-6}">${name}</text>`;
        }
      }
    });
  }
  (d.places||[]).forEach(p=>{
    const isSect = ['宗门','洞天','道场','山字印','剑庐','洞府','下宗','福地宗门','福地'].includes(p.tag);
    const isCap = ['王朝','国都','藩属','首富','飞升境','武场','边关','南疆大城','世家','军营','一洲首富'].includes(p.tag);
    if(!painted){
      if(isSect) s+=`<use href="#sect" transform="translate(${p.x},${p.y})"/>`;
      else if(isCap) s+=`<use href="#capital" transform="translate(${p.x},${p.y}) scale(.9)"/>`;
      else s+=`<use href="#city" transform="translate(${p.x},${p.y}) scale(.85)"/>`;
      if(Math.abs(p.lx-p.x)>2||Math.abs(p.ly-p.y)>2){
        s+=`<line x1="${p.x}" y1="${p.y}" x2="${p.lx}" y2="${p.ly}" stroke="#6b5f49" stroke-width="0.8" opacity=".6"/>`;
      }
    }
    s+=`<circle cx="${p.x}" cy="${p.y}" r="${painted?4.2:4}" fill="${painted?'#f0e6c4':(CLS[p.cls]||'#2f2a20')}" stroke="${painted?'#1a2430':'none'}" stroke-width="1.2"/>`;
    if(showNames){
      const nm=p.name||'';
      const hw=Math.max(48, nm.length*11+16);
      s+=`<g class="poi" data-key="${p.key}" data-zhou="${key}" tabindex="0" role="button">`;
      s+=`<text class="pl" x="${p.lx}" y="${p.ly}" text-anchor="middle">${nm}</text>`;
      s+=`<rect x="${p.lx-hw/2}" y="${p.ly-22}" width="${hw}" height="26" fill="transparent"/>`;
      s+=`<circle cx="${p.x}" cy="${p.y}" r="14" fill="transparent"/></g>`;
    }
  });
  s+=`</g>`;
  scene.innerHTML=s;
  attachPoi();
  attachRoads();
  attachRealms();
  updateCrumb();
}

function applyT(){ scene.setAttribute('transform',`translate(${tx},${ty}) scale(${scale})`);
  document.getElementById('pct').textContent=Math.round(scale*100)+'%'; }
function resetT(){ scale=1; tx=0; ty=0; applyT(); }
function zoomAt(cx,cy,factor){
  const ns=Math.min(9,Math.max(0.6,scale*factor));
  tx=cx-(cx-tx)*(ns/scale); ty=cy-(cy-ty)*(ns/scale); scale=ns; applyT();
}
function clientToSvg(e){
  const r=svg.getBoundingClientRect();
  return [(e.clientX-r.left)/r.width*1600, (e.clientY-r.top)/r.height*1100];
}
let moved=false, last=null;
svg.addEventListener('wheel',e=>{ e.preventDefault(); const [cx,cy]=clientToSvg(e); zoomAt(cx,cy, e.deltaY<0?1.15:1/1.15); },{passive:false});
svg.addEventListener('mousedown',e=>{ moved=false; last=[e.clientX,e.clientY]; });
window.addEventListener('mousemove',e=>{
  if(!last) return; const dx=e.clientX-last[0], dy=e.clientY-last[1];
  if(Math.abs(dx)+Math.abs(dy)>3) moved=true;
  if(moved){ const r=svg.getBoundingClientRect(); tx+=dx/r.width*1600; ty+=dy/r.height*1100; last=[e.clientX,e.clientY]; applyT(); }
});
window.addEventListener('mouseup',()=>{ last=null; });
let t2=null;
svg.addEventListener('touchstart',e=>{ if(e.touches.length===1){last=[e.touches[0].clientX,e.touches[0].clientY];moved=false;} else if(e.touches.length===2){ t2=touchDist(e); } },{passive:false});
svg.addEventListener('touchmove',e=>{ e.preventDefault();
  if(e.touches.length===1&&last){ const dx=e.touches[0].clientX-last[0], dy=e.touches[0].clientY-last[1];
    if(Math.abs(dx)+Math.abs(dy)>3) moved=true; if(moved){ const r=svg.getBoundingClientRect(); tx+=dx/r.width*1600; ty+=dy/r.height*1100; last=[e.touches[0].clientX,e.touches[0].clientY]; applyT(); } }
  else if(e.touches.length===2){ const d=touchDist(e); if(t2){ const [cx,cy]=touchMid(e); zoomAt(cx,cy,d/t2); } t2=d; }
},{passive:false});
svg.addEventListener('touchend',()=>{ last=null; t2=null; });
function touchDist(e){ const a=e.touches[0],b=e.touches[1]; return Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY); }
function touchMid(e){ const a=e.touches[0],b=e.touches[1]; const r=svg.getBoundingClientRect();
  return [(a.clientX+b.clientX)/2/r.width*1600,(a.clientY+b.clientY)/2/r.height*1100]; }
document.getElementById('zin').addEventListener('click',()=>zoomAt(800,550,1.2));
document.getElementById('zout').addEventListener('click',()=>zoomAt(800,550,1/1.2));

  if(btnRealms) btnRealms.classList.toggle('on', showRealms);
  if(view==='world') renderWorld();
  else if(view==='zhou' && curKey) renderZhou(curKey);
}
if(btnRoads) btnRoads.addEventListener('click',()=>{ showRoads=!showRoads; refreshLayers(); });
if(btnNames) btnNames.addEventListener('click',()=>{ showNames=!showNames; refreshLayers(); });
if(btnRoadLbl) btnRoadLbl.addEventListener('click',()=>{ showRoadLbl=!showRoadLbl; refreshLayers(); });
if(btnRealms) btnRealms.addEventListener('click',()=>{ showRealms=!showRealms; refreshLayers(); });

/* 地名检索：输入即列命中，点击跳转 */
const poiSearch=document.getElementById('poiSearch');
function jumpToPlace(zk, key){
  side.classList.remove('open');
  drill(zk);
  show(key, zk);
  const p=ZHOU[zk].detail.places.find(x=>x.key===key);
  if(p){
    /* 将目标点拉到视野中心附近 */
    const fit=fitLayer(ZHOU[zk].detail);
    const sx=p.x*fit.s+fit.ox, sy=p.y*fit.s+fit.oy;
    scale=1.8; tx=800-sx*scale; ty=550-sy*scale; applyT();
  }
}
if(poiSearch){
  poiSearch.addEventListener('input',()=>{
    const q=(poiSearch.value||'').trim();
    if(!q){ side.classList.remove('open'); return; }
    const hits=[];
    Object.keys(ZHOU).forEach(zk=>{
      (ZHOU[zk].detail.places||[]).forEach(p=>{
        if(p.name.indexOf(q)>=0 || (p.tag||'').indexOf(q)>=0) hits.push({zk,key:p.key,name:p.name,tag:p.tag||'要地',kind:'poi'});
      });
      (ZHOU[zk].detail.realms||[]).forEach(r=>{
        if(r.name.indexOf(q)>=0) hits.push({zk,key:r.key,name:r.name,tag:'势力',kind:'realm'});
      });
    });
    document.getElementById('pTag').textContent='检索';
    document.getElementById('pName').textContent=`「${q}」`;
    document.getElementById('pSub').textContent=`命中 ${hits.length} 处`;
    let html='';
    if(!hits.length) html='<p>无匹配地名。可试：宗门、洞天、王朝、大骊、青鸾、山、湖。</p>';
    else{
      html='<ul class="hitlist">';
      hits.slice(0,40).forEach(h=>{
        if(h.kind==='realm'){
          html+=`<li onclick="jumpToRealm('${h.zk}','${h.key}')"><b>${h.name}</b> <span style="color:#8a785a;font-size:12px">· ${ZHOU[h.zk].name} · 势力</span></li>`;
        }else{
          html+=`<li onclick="jumpToPlace('${h.zk}','${h.key}')"><b>${h.name}</b> <span style="color:#8a785a;font-size:12px">· ${ZHOU[h.zk].name} · ${h.tag}</span></li>`;
        }
      });
      html+='</ul>';
    }
    html+='<div class="src">仅索引图上已标注要地/势力；原著未明载者不臆造</div>';
    document.getElementById('pBody').innerHTML=html;
    side.classList.add('open');
  });
  poiSearch.addEventListener('keydown',e=>{
    if(e.key==='Escape'){ poiSearch.value=''; side.classList.remove('open'); poiSearch.blur(); }
  });
}
window.jumpToPlace=jumpToPlace;
function jumpToRealm(zk, key){
  side.classList.remove('open');
  drill(zk);
  const r=(ZHOU[zk].detail.realms||[]).find(x=>x.key===key);
  if(r){
    document.getElementById('pTag').textContent='势力';
    document.getElementById('pName').textContent=r.name;
    document.getElementById('pSub').textContent=ZHOU[zk].name;
    let html=`<p>${r.desc}</p>`;
    html += charsSectionHtml(PLACE_CHARS[key]);
    html+='<div class="src">势力范围为据原著王朝/藩属关系勾勒的示意边界，非逐里实测</div>';
    document.getElementById('pBody').innerHTML=html;
    bindCharCards(document.getElementById('pBody'));
    side.classList.add('open');
    if(r.lx!=null){
      const fit=fitLayer(ZHOU[zk].detail);
      const sx=r.lx*fit.s+fit.ox, sy=r.ly*fit.s+fit.oy;
      scale=1.6; tx=800-sx*scale; ty=550-sy*scale; applyT();
    }
  }
}
window.jumpToRealm=jumpToRealm;

renderWorld(); applyT();
</script>
</body>
</html>
